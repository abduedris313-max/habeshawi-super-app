<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>React Starter Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/harmony-sdk.js"></script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="bg-[#f2f2f7] dark:bg-black text-neutral-900 dark:text-white transition-colors duration-200">
  <div id="root" class="max-w-md mx-auto p-4 pt-[var(--safe-top)] pb-[var(--safe-bottom)] min-h-screen">
    <!-- Header -->
    <header class="flex items-center justify-between py-2 mb-4">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 text-xl font-bold">
          ✦
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Daily Momentum</h1>
          <p class="text-xs text-neutral-500 dark:text-neutral-400">React + Harmony SDK Starter</p>
        </div>
      </div>
      <button id="close-btn" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-neutral-200 dark:bg-white/10 hover:bg-neutral-300 dark:hover:bg-white/20 text-neutral-700 dark:text-neutral-200 transition-all cursor-pointer">
        Close
      </button>
    </header>

    <!-- Progress Card -->
    <div class="p-4 rounded-2xl border bg-white/90 dark:bg-[#1c1c1e]/85 border-black/5 dark:border-white/10 backdrop-blur-xl mb-4 shadow-xs">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold uppercase tracking-wider text-neutral-400">Today's Progress</span>
        <span id="progress-text" class="text-xs font-bold font-mono text-blue-500">2 of 3 (67%)</span>
      </div>
      <div class="w-full h-2 rounded-full bg-neutral-200 dark:bg-neutral-800 overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-indigo-500 transition-all duration-300 rounded-full" style="width: 67%;"></div>
      </div>
    </div>

    <!-- Habit Input -->
    <div class="flex gap-2 mb-4">
      <input id="habit-input" type="text" placeholder="Add new habit (e.g. Read 15 pages)..." class="flex-1 px-4 py-2.5 rounded-xl text-sm border bg-white dark:bg-[#1c1c1e] border-neutral-300 dark:border-white/10 text-neutral-900 dark:text-white placeholder:text-neutral-400 dark:placeholder:text-neutral-500 outline-none focus:border-blue-500">
      <button id="habit-add-btn" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm shadow-md shadow-blue-600/25 active:scale-95 transition-all cursor-pointer">
        Add
      </button>
    </div>

    <!-- Habit List -->
    <div id="habit-list" class="space-y-2.5 mb-6">
      <!-- Generated items -->
    </div>

    <!-- Haptic Demos -->
    <div class="p-3.5 rounded-2xl border bg-white/60 dark:bg-[#1c1c1e]/50 border-black/5 dark:border-white/10 text-center space-y-2">
      <div class="text-[11px] font-semibold text-neutral-400 uppercase tracking-wider">
        Test Haptic Feedback
      </div>
      <div class="flex justify-center gap-2">
        <button onclick="Harmony.ui.triggerHaptic('light')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-neutral-200/80 dark:bg-white/10 hover:bg-neutral-300 dark:hover:bg-white/20 cursor-pointer">Light</button>
        <button onclick="Harmony.ui.triggerHaptic('medium')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-neutral-200/80 dark:bg-white/10 hover:bg-neutral-300 dark:hover:bg-white/20 cursor-pointer">Medium</button>
        <button onclick="Harmony.ui.triggerHaptic('heavy')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-neutral-200/80 dark:bg-white/10 hover:bg-neutral-300 dark:hover:bg-white/20 cursor-pointer">Heavy</button>
        <button onclick="Harmony.ui.triggerHaptic('success')" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 cursor-pointer">Success</button>
      </div>
    </div>
  </div>

  <script>
    let habits = [
      { id: '1', title: 'Morning Hydration & Water (500ml)', streak: 12, completedToday: true },
      { id: '2', title: 'Deep Work Session (45 min)', streak: 5, completedToday: true },
      { id: '3', title: 'Evening Walk / Cardio', streak: 8, completedToday: false }
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      await Harmony.init();

      // Theme Sync
      Harmony.theme.onChange((isDark) => {
        document.documentElement.classList.toggle('dark', isDark);
      });

      // Storage restore
      const saved = await Harmony.storage.getItem('user_habits');
      if (Array.isArray(saved) && saved.length > 0) habits = saved;

      render();

      document.getElementById('habit-add-btn').addEventListener('click', () => {
        const input = document.getElementById('habit-input');
        const val = input.value.trim();
        if (!val) return;
        Harmony.ui.triggerHaptic('medium');
        habits.unshift({ id: Date.now().toString(), title: val, streak: 1, completedToday: true });
        input.value = '';
        saveAndRender();
        Harmony.ui.showToast({ title: 'Habit Created', type: 'info' });
      });

      document.getElementById('close-btn').addEventListener('click', () => {
        Harmony.ui.triggerHaptic('dismiss');
        Harmony.ui.close();
      });
    });

    // Security Helper: Escape user input to prevent DOM-based XSS when using innerHTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function saveAndRender() {
      Harmony.storage.setItem('user_habits', habits);
      render();
    }

    function toggleHabit(id) {
      Harmony.ui.triggerHaptic('success');
      habits = habits.map(h => {
        if (h.id === id) {
          const next = !h.completedToday;
          return { ...h, completedToday: next, streak: next ? h.streak + 1 : Math.max(0, h.streak - 1) };
        }
        return h;
      });
      saveAndRender();
    }

    function render() {
      const container = document.getElementById('habit-list');
      container.innerHTML = '';
      const completed = habits.filter(h => h.completedToday).length;
      const pct = habits.length > 0 ? Math.round((completed / habits.length) * 100) : 0;

      document.getElementById('progress-text').textContent = `${completed} of ${habits.length} (${pct}%)`;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      habits.forEach(h => {
        const item = document.createElement('div');
        item.className = `p-3.5 rounded-2xl border flex items-center justify-between cursor-pointer active:scale-[0.98] transition-all select-none ${
          h.completedToday ? 'bg-blue-50/70 dark:bg-blue-950/20 border-blue-200 dark:border-blue-500/30' : 'bg-white dark:bg-[#1c1c1e]/80 border-black/5 dark:border-white/10'
        }`;
        item.onclick = () => toggleHabit(h.id);
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
              h.completedToday ? 'bg-blue-600 text-white' : 'border-2 border-neutral-300 dark:border-neutral-600'
            }">
              ${h.completedToday ? '✓' : ''}
            </div>
            <div>
              <!-- Escaped title to mitigate DOM-based XSS vulnerability -->
              <div class="text-sm font-medium ${h.completedToday ? 'line-through text-neutral-400' : ''}">${escapeHtml(h.title)}</div>
              <div class="text-[11px] text-neutral-400">🔥 ${h.streak} day streak</div>
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }
  </script>
</body>
</html>
