<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="harmonyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="harmonyGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Premium Canvas -->
  <rect width="100" height="100" rx="24" fill="#090a0f" />

  <!-- Soft Radial Glow Background -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#harmonyGrad1)" opacity="0.15" />

  <!-- Outer Fluid Orbital Loop -->
  <path
    d="M 28,32 C 28,18 48,18 50,34 C 52,50 72,50 72,36 C 72,22 88,28 88,48 C 88,72 68,82 50,68 C 32,54 12,68 12,48 C 12,38 20,32 28,32 Z"
    fill="none"
    stroke="url(#harmonyGrad1)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glowEffect)"
  />

  <!-- Inner Synchronized Core Wave -->
  <path
    d="M 32,58 C 32,48 44,48 50,56 C 56,64 68,64 68,52 C 68,40 50,26 34,42"
    fill="none"
    stroke="url(#harmonyGrad2)"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Glowing Accent Pulse Nodes -->
  <circle cx="50" cy="34" r="4.5" fill="#f472b6" />
  <circle cx="50" cy="68" r="4.5" fill="#60a5fa" />
</svg>
